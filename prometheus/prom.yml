global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'libi-api'
    metrics_path: /metrics
    static_configs:
      # Local default. On Railway, update to the internal service URL
      # e.g. libi-api.railway.internal:8000
      - targets: ['host.docker.internal:8000']
